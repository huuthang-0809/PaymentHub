[project]
name = "paymenthub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "duyvuvsf", email = "v.duyvd11@vinsmartfuture.tech" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pymongo>=4.11,<5",
    "psycopg[binary,pool]>=3.3.6",
    "python-multipart>=0.0.20",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
    "import-linter>=2.15",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0.1",
    "prometheus-client>=0.23,<1",
]

[project.scripts]
paymenthub = "paymenthub:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.importlinter]
root_packages = ["shared_kernel", "canonical", "reconciliation", "bootstrap"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain does not depend on infrastructure"
type = "forbidden"
source_modules = ["canonical.domain", "shared_kernel"]
forbidden_modules = ["fastapi", "pymongo", "psycopg", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Reconciliation application stays independent of infrastructure"
type = "forbidden"
source_modules = ["reconciliation.application"]
forbidden_modules = ["reconciliation.adapters", "bootstrap", "fastapi", "psycopg", "pymongo", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Reconciliation domain stays independent of outer layers"
type = "forbidden"
source_modules = ["reconciliation.domain"]
forbidden_modules = [
    "reconciliation.application",
    "reconciliation.adapters",
    "bootstrap", "fastapi", "psycopg", "pymongo", "sqlalchemy",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.uv]
package = false
system-certs = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
]
