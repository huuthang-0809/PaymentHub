services:
  postgres:
    image: postgres:15
    container_name: paymenthub_pg
    environment:
      POSTGRES_USER: paymenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paymenthub}
      POSTGRES_DB: paymenthub
    ports:
      - "5432:5432"

    # Mount file init schema source
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U paymenthub -d paymenthub" ]
      interval: 10s
      timeout: 30s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: paymenthub_mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  generator:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: docker/test-data-generator.Dockerfile
    environment:
      MONGO_URI: mongodb://mongodb:27017
      GENERATOR_SEED: ${GENERATOR_SEED:-20260923}
      RECORDS_PER_REGION: ${RECORDS_PER_REGION:-5000}
      GENERATOR_PROFILE: ${GENERATOR_PROFILE:-baseline}
      GENERATOR_TIME_SPAN_HOURS: ${GENERATOR_TIME_SPAN_HOURS:-24}
      GENERATOR_END_AT: ${GENERATOR_END_AT:-}
      GROUND_TRUTH_PATH: /test-data/ground_truth.json
      PROVIDER_STATEMENTS_DIR: /test-data/provider-statements
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./tests/generated:/test-data

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: [ "alembic", "upgrade", "head" ]
    environment:
      - DATABASE_URL=postgresql+psycopg://paymenthub:${POSTGRES_PASSWORD:-paymenthub}@postgres:5432/paymenthub
    depends_on:
      postgres:
        condition: service_healthy

  monitoring-batch:
    profiles: ["monitoring"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "bootstrap.monitoring_batch"]
    environment:
      DATABASE_URL: postgresql+psycopg://paymenthub:${POSTGRES_PASSWORD:-paymenthub}@postgres:5432/paymenthub
      MONGO_URI: mongodb://mongodb:27017
      GENERATOR_SEED: ${GENERATOR_SEED:-20260923}
      RECORDS_PER_REGION: ${RECORDS_PER_REGION:-5000}
      MONITORING_WINDOW_SIZES: ${MONITORING_WINDOW_SIZES:-1,5,15}
      MONITORING_ALLOWED_LATENESS_MINUTES: ${MONITORING_ALLOWED_LATENESS_MINUTES:-5}
      MONITORING_RETENTION_HOURS: ${MONITORING_RETENTION_HOURS:-24}
      MONITORING_REPLAYS: ${MONITORING_REPLAYS:-1}
    depends_on:
      mongodb:
        condition: service_healthy
      generator:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  health-evaluation:
    profiles: ["monitoring"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "bootstrap.health_evaluation"]
    environment:
      DATABASE_URL: postgresql+psycopg://paymenthub:${POSTGRES_PASSWORD:-paymenthub}@postgres:5432/paymenthub
      HEALTH_RULES_FILE: /app/config/health-rules.demo.json
      HEALTH_SCOPES: ${HEALTH_SCOPES:-}
      MONITORING_QUERY_TIMEOUT: ${MONITORING_QUERY_TIMEOUT:-5}
      MONITORING_WRITE_TIMEOUT: ${MONITORING_WRITE_TIMEOUT:-5}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      monitoring-batch:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["uvicorn", "bootstrap.main:app", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 6g
    mem_reservation: 1g
    environment:
      DATABASE_URL: postgresql://paymenthub:${POSTGRES_PASSWORD:-paymenthub}@postgres:5432/paymenthub
      MONGO_URI: mongodb://mongodb:27017
      RECON_WORKER_COUNT: ${RECON_WORKER_COUNT:-1}
      RECON_SCHEDULES_JSON: ${RECON_SCHEDULES_JSON:-[]}
      MONITORING_QUERY_TIMEOUT: ${MONITORING_QUERY_TIMEOUT:-5}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      mongodb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  rabbitmq:
    profiles: ["monitoring", "realtime", "tools"]
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-paymenthub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-paymenthub}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/config/rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq-consumer:
    profiles: ["monitoring"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "bootstrap.rabbitmq_consumer"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://paymenthub:${POSTGRES_PASSWORD:-paymenthub}@postgres:5432/paymenthub
      RABBITMQ_URL: amqp://paymenthub:${RABBITMQ_PASSWORD:-paymenthub}@rabbitmq:5672/
      RABBITMQ_PREFETCH: "${RABBITMQ_PREFETCH:-20}"
      RABBITMQ_BATCH_SIZE: "${RABBITMQ_BATCH_SIZE:-20}"
      RABBITMQ_BATCH_WAIT_SECONDS: "${RABBITMQ_BATCH_WAIT_SECONDS:-5}"
      MONITORING_WINDOW_SIZES: ${MONITORING_WINDOW_SIZES:-1,5,15}
      MONITORING_ALLOWED_LATENESS_MINUTES: ${MONITORING_ALLOWED_LATENESS_MINUTES:-5}
      MONITORING_RETENTION_HOURS: ${MONITORING_RETENTION_HOURS:-24}
      MONITORING_REALTIME_LOOKBACK_HOURS: "${MONITORING_REALTIME_LOOKBACK_HOURS:-24}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  realtime-simulator:
    profiles: ["realtime"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "bootstrap.realtime_transaction_simulator"]
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://paymenthub:${RABBITMQ_PASSWORD:-paymenthub}@rabbitmq:5672/
      REALTIME_SEED: "${REALTIME_SEED:-20261013}"
      REALTIME_TXNS_PER_SECOND: "${REALTIME_TXNS_PER_SECOND:-0.2}"
      REALTIME_FAILURE_RATE: "${REALTIME_FAILURE_RATE:-0.03}"
      REALTIME_STUCK_RATE: "${REALTIME_STUCK_RATE:-0.01}"
      REALTIME_MIN_TERMINAL_DELAY_SECONDS: "${REALTIME_MIN_TERMINAL_DELAY_SECONDS:-2}"
      REALTIME_MAX_TERMINAL_DELAY_SECONDS: "${REALTIME_MAX_TERMINAL_DELAY_SECONDS:-12}"
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq-dlq-reprocess:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "bootstrap.rabbitmq_dlq_reprocess"]
    environment:
      RABBITMQ_URL: amqp://paymenthub:paymenthub@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  reconciliation-scheduler:
    user: "${SCHEDULER_UID:-10001}:${SCHEDULER_GID:-10001}"
    build:
      context: .
      dockerfile: docker/scheduler.Dockerfile
    environment:
      RECON_API_URL: http://api:8000
      MONGO_URI: mongodb://mongodb:27017
      RECON_STATEMENT_DIR: /statements
      RECON_SCHEDULER_POLL_SECONDS: ${RECON_SCHEDULER_POLL_SECONDS:-60}
      RECON_SCHEDULER_METRICS_PORT: 9101
      RECON_SCHEDULES_JSON: ${RECON_SCHEDULES_JSON:-[]}
      RECON_API_TIMEOUT_SECONDS: ${RECON_API_TIMEOUT_SECONDS:-30}
      RECON_STATUS_POLL_SECONDS: ${RECON_STATUS_POLL_SECONDS:-15}
      RECON_STATUS_TIMEOUT_SECONDS: ${RECON_STATUS_TIMEOUT_SECONDS:-3600}
      RECON_WORKER_COUNT: ${RECON_WORKER_COUNT:-1}
      RECON_SIMULATION_START_DATE: ${SIMULATION_START_DATE:-}
      RECON_SIMULATION_DAYS: ${SIMULATION_DAYS:-1}
      RECON_SIMULATION_SECONDS_PER_DAY: ${SIMULATION_SECONDS_PER_DAY:-2}
    expose:
      - "9101"
    volumes:
      - ${RECON_STATEMENT_DIR:-./tests/generated/month-simulation/provider-statements}:/statements
    depends_on:
      api:
        condition: service_healthy

  reverse-proxy:
    image: nginx:stable-alpine
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - reconciliation-scheduler
      - grafana

  month-simulation-generate:
    profiles: ["simulation"]
    build:
      context: .
      dockerfile: docker/test-data-generator.Dockerfile
    command: ["python", "-m", "tests.data_generator.month_simulation"]
    environment:
      MONGO_URI: mongodb://mongodb:27017
      SIMULATION_START_DATE: ${SIMULATION_START_DATE:-2026-09-01}
      SIMULATION_DAYS: ${SIMULATION_DAYS:-30}
      SIMULATION_MISSING_STATEMENT_COUNT: ${SIMULATION_MISSING_STATEMENT_COUNT:-2}
      SIMULATION_WRITE_GROUND_TRUTH: ${SIMULATION_WRITE_GROUND_TRUTH:-false}
      RECORDS_PER_REGION: ${SIMULATION_RECORDS_PER_REGION:-100}
      SIMULATION_OUTPUT_DIR: /test-data/month-simulation
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./tests/generated:/test-data

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: paymenthub_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d} # keep data for 15d
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: paymenthub_alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    build:
      context: ./docker/grafana/plugins/paymenthub-evidence-panel
    image: paymenthub-grafana:13.1.6
    container_name: paymenthub_grafana
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paymenthub}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8080}
      # Allow dashboard actions to use the Infinity datasource.
      GF_FEATURE_TOGGLES_ENABLE: vizActionsAuth
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: paymenthub-evidence-panel
      # Unused datasource backends; keep Infinity for the API dashboards.
      GF_PLUGINS_DISABLE_PLUGINS: "elasticsearch,zipkin"
      # The Operations run list still follows up to 50 pages. Transaction
      # evidence uses the custom panel and loads one page per navigation.
      GF_PLUGIN_PAGINATION_MAX_PAGES: ${GRAFANA_API_MAX_PAGES:-50}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - alertmanager
      - api

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-paymenthub_postgres_data_v2}
  mongo_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
