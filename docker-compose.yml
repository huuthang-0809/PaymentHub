version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: paymenthub_pg
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: paymenthub
    ports:
      - "5432:5432"
    
    # Mount file init schema source
    volumes:
      - ./db_init:/docker-entrypoint-initdb.d
      
  mongodb:
    image: mongo:latest
    container_name: paymenthub_mongo
    ports:
      - "27017:27017"