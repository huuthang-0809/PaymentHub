server {
    listen 80;

    location ~ ^/(generation-jobs|simulation-jobs)(/|$) {
        proxy_pass http://reconciliation-scheduler:9101;
        proxy_set_header Host $host; # Preserve and forward the original domain name that the user has called.
    }

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host; # Get the Domain Name and Port intact.
        proxy_set_header X-Forwarded-Proto $scheme; # forwards information about the original protocol the user is using (whether it's http or https). The $scheme variable will automatically retrieve this value.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # upgrade from http -> websocket
    }
}
