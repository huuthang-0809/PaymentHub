global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/reconciliation.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: paymenthub-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
  - job_name: paymenthub-scheduler
    static_configs:
      - targets: ["reconciliation-scheduler:9101"]